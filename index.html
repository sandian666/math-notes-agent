<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <title>S5 数学笔记问答</title>
</head>
<body>
    <h1>我的数学笔记 Agent</h1>

    <input id="q" placeholder="输入你的问题，比如：奇变偶不变是什么口诀？">
    <button id="go">提问</button>

    <div id="out" style="white-space: pre-wrap; margin-top: 16px;"></div>
<script>
    // ===== 新增①：拿到（或新建）本浏览器的会话号 =====
    let sid = localStorage.getItem("s5_sid");   // 去浏览器的"储物柜"找；没有就是 null
    if (!sid) {                                 // 第一次来 → 柜子里没有
                // 安全上下文（https / localhost）才有 randomUUID；http 公网没有 → 退回随机串
        sid = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : "sid-" + Date.now() + "-" + Math.random().toString(16).slice(2);
        localStorage.setItem("s5_sid", sid);    // 存回柜子 → 以后刷新都还是它
    }

    function askQuestion() {                                          // 定义一个函数（点击时执行）
        const out = document.getElementById("out");                   // 找到显示区
        out.textContent = "";                        // 先给反馈
        const question = document.getElementById("q").value;          // 读出输入框里的字

        const es = new EventSource("/ask_stream?question=" + encodeURIComponent(question) + "&session_id=" + sid);
        es.onmessage = (e) => { out.textContent += e.data; };   // ← 累加，不是赋值
        es.onerror = () => { es.close(); };   // 收完/出错就断开（不然它会自动重连，答案会重复贴！）
    }

    document.getElementById("go").addEventListener("click", askQuestion);  // 把函数交给按钮（不带括号）
</script>
</body>
</html>
